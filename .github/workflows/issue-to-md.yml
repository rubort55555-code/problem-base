name: Issue to Markdown

on:
  issues:
    types: [opened, edited, labeled, unlabeled, closed, reopened]
  issue_comment:
    types: [created]

permissions:
  contents: write

concurrency:
  group: issue-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Создать или обновить заметку
        run: python scripts/issue_to_md.py

      - name: Закоммитить изменения
        run: |
          git config user.name "problem-base-bot"
          git config user.email "problem-base-bot@users.noreply.github.com"
          git add issues
          if git diff --cached --quiet; then
            echo "Изменений нет"
            exit 0
          fi
          git commit -m "sync: issue #${{ github.event.issue.number }}"
          git pull --rebase
          git push
